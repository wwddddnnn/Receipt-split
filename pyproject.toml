[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-split"
version = "0.1.0"
description = "Phase 1 receipt-expense extraction CLI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "openai>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[project.scripts]
receipt-split = "receipt_split.cli:main"
receipt-split-ledger = "receipt_split.ledger_cli:main"
receipt-split-admin = "receipt_split.admin_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["receipt_split*"]
